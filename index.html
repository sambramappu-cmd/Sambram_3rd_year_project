<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioSentry AI - Thyroid Diagnosis</title>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'kn,hi,te,ta,en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
      /* Hide the top banner from Google Translate */
      .goog-te-banner-frame.skiptranslate { display: none !important; }
      body { top: 0px !important; }
      
      /* Modern Translate Widget Styling */
      #google_translate_element {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
      }
      
      .goog-te-gadget-simple {
        background-color: rgba(255, 255, 255, 0.8) !important;
        backdrop-filter: blur(8px) !important;
        border: 1px solid rgba(0, 0, 0, 0.05) !important;
        padding: 8px 12px !important;
        border-radius: 16px !important;
        box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.1) !important;
        display: flex !important;
        align-items: center !important;
        gap: 8px !important;
        font-family: inherit !important;
        transition: all 0.2s ease !important;
      }

      .goog-te-gadget-simple:hover {
        background-color: white !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.1) !important;
      }

      .goog-te-gadget-icon {
        display: none !important;
      }

      .goog-te-menu-value {
        color: #1a1a1a !important;
        font-size: 13px !important;
        font-weight: 600 !important;
        margin: 0 !important;
      }

      .goog-te-menu-value span {
        border-left: none !important;
      }

      .goog-te-menu-value img {
        display: none !important;
      }

      /* Custom icon injection via CSS */
      .goog-te-gadget-simple::before {
        content: "🌐";
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
